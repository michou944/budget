<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Budget</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Budget">
<style>
  :root { --bg:#f5f5f4; --card:#fff; --fg:#1c1917; --muted:#78716c; --line:#e7e5e4; --accent:#0f766e; --bad:#b91c1c; --warn:#b45309; --good:#15803d; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0c0a09; --card:#1c1917; --fg:#f5f5f4; --muted:#a8a29e; --line:#292524; --accent:#2dd4bf; --bad:#f87171; --warn:#fbbf24; --good:#4ade80; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.4 system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--fg); padding-bottom:calc(64px + env(safe-area-inset-bottom)); }
  main { max-width:640px; margin:0 auto; padding:12px 16px; }
  h2 { font-size:15px; margin:0 0 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin:0 0 12px; }
  .hero { text-align:center; } .big { font-size:34px; font-weight:700; color:var(--accent); }
  .row { display:flex; justify-content:space-between; gap:8px; padding:4px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; } .row.total { font-weight:600; }
  .muted { color:var(--muted); font-size:13px; } .bad { color:var(--bad); } .warn { color:var(--warn); } .good { color:var(--good); }
  .neg { color:var(--bad); } .pos { color:var(--good); }
  form { display:grid; gap:8px; } .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  input, select, button { font:inherit; padding:9px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); min-width:0; width:100%; }
  input[type=checkbox] { width:auto; } label.chk { display:flex; gap:8px; align-items:center; }
  button { background:var(--accent); color:#fff; border:0; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  button.small { width:auto; padding:5px 9px; font-size:13px; } button.danger { background:var(--bad); }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:3px; } .bar > i { display:block; height:100%; background:var(--accent); }
  .bar > i.over { background:var(--bad); }
  .op { display:flex; justify-content:space-between; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); }
  .op:last-child { border-bottom:0; } .op .l { min-width:0; overflow-wrap:anywhere; } .op .r { text-align:right; white-space:nowrap; }
  .actions { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; margin-top:4px; }
  nav { position:fixed; bottom:0; left:0; right:0; display:flex; background:var(--card); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
  nav button { flex:1; background:none; color:var(--muted); border-radius:0; padding:12px 2px; font-size:12px; }
  nav button[aria-current=page] { color:var(--accent); }
  .op.old { opacity:.55; } a { color:var(--accent); }
  details.fold > summary { font-weight:600; cursor:pointer; padding:2px 0; } details.fold[open] > summary { margin-bottom:8px; }
  .verdict { font-size:12px; font-weight:700; padding:1px 8px; border-radius:10px; border:1px solid currentColor; margin-left:4px; white-space:nowrap; }
  .op.tap { cursor:pointer; } .op.tap:active { background:var(--bg); }
  .tag { font-size:11px; padding:1px 6px; border-radius:6px; border:1px solid var(--line); color:var(--muted); margin-left:4px; }
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav">
  <button data-tab="dash">Accueil</button><button data-tab="ops">Mouvements</button>
  <button data-tab="stock">Bourse</button><button data-tab="settings">Réglages</button>
</nav>
<script type="module" src="ui.js"></script>
</body>
</html>
